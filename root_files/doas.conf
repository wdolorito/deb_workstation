#
# /etc/doas.conf
#
permit persist :sudo

permit nopass :adm as root cmd /usr/bin/dmesg
permit nopass :adm as root cmd /usr/sbin/dhclient
permit nopass :adm as root cmd /usr/sbin/wpa_supplicant
permit nopass :adm as root cmd /usr/bin/apt-get args update
permit nopass :adm as root cmd /usr/bin/apt-get args -y dist-upgrade
permit nopass :adm as root cmd /usr/bin/apt-get args -y autoremove --purge
permit nopass :adm as root cmd /usr/bin/apt-get args autoclean
permit nopass :adm as root cmd /usr/bin/apt-get args clean
